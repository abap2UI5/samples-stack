name: check-702

# The 7.02 downport (npm run check:702, scripts/check-702.mjs): a copy of the
# tree downported with abaplint --fix and linted at v702, 0 issues. The
# packages without a 7.02 form - RAP and EML, ABAP Push Channels, the ABAP
# Cloud HTTP client - are left out by .github/abaplint/abap_702.jsonc, which
# says why for each, and every run prints them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-702-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-702:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run check:702
