name: check-abapdoc

# An ABAP Doc block attaches to the ONE declaration that follows it. Put it
# before a chain keyword (`CONSTANTS:`, `DATA:`, `METHODS:`), inside a parameter
# list, or before a section end, and it attaches to nothing: the text is in the
# source, it reads like documentation, and it is shown nowhere. Nothing breaks,
# which is exactly why it recurs - and abaplint's `abapdoc` rule cannot tell a
# block that attaches to nothing from one that was never written.
#
# SLIN/ATC does report it, but SLIN runs in a real system after the pull, which
# is the worst place to learn it. That is how five of them were found on
# z2ui5_cl_smps_app_000.
#
# The gate existed and had no workflow, so it ran only where somebody typed
# `npm run check` - which meant a pull request could not go red on it. A check
# nothing enforces is a check nobody runs.
#
# Plain node, no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-abapdoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abapdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/check-abapdoc.mjs
