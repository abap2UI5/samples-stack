name: check-samples-md

# SAMPLES.md is generated from the overview app's catalogue and the classes'
# @keywords lines. It is committed so it can be read on GitHub without a
# checkout, which is the whole point of it - and a committed generated file is
# a file that goes stale the first time somebody adds a sample and does not
# rerun the generator. This is what notices.
#
# It also closes the loop the other way: check-overview refuses a catalogue
# entry naming a class that does not exist, this refuses an app that exists and
# is in no entry.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-samples-md-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-samples-md:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/generate-samples-md.mjs --check
