name: check-released-api

# Does a package whose "Runs on" says Cloud name an API that ABAP Cloud does
# not release? The Cloud lint of create-package-branches judges the LANGUAGE
# version only - an unknown non-Z class sits outside errorNamespace and stays
# silent there. This run lints every cloud-capable package with errorNamespace
# matching every name, so whatever the steampunk-2305-api dependency (the list
# of released objects) does not carry is an error. The documented exceptions -
# src/10/01 and src/10/03 - and any open finding are listed in the script and
# printed on every run. See scripts/check-released-api.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-released-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-released-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: node scripts/check-released-api.mjs
