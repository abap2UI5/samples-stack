name: check-keywords

# Every app in this repository has to say what it is about, in a `" @keywords`
# line the ABAP compiler cannot see and therefore cannot enforce. Nothing about
# a sample without one is broken - it compiles, it runs, it is listed in the
# overview - which is exactly why the omission survives: the only symptom is
# that nobody looking for it ever arrives. This repository ran that way for its
# whole life, with 40 classes and not one keyword line.
#
# Plain node, no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-keywords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/check-keywords.mjs
