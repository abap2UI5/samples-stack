name: check-page-titles

# The page a sample opens with says it is abap2UI5: its main page title starts
# with `abap2UI5 - `. Nothing else fails when a title drifts - three had, before
# this gate existed - so a renamed or newly written sample would carry its own
# private naming scheme for as long as nobody happened to look.
#
# Plain node, no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-page-titles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-page-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-page-titles.mjs
