name: check-catalogue

# catalogue.json is the catalogue as data - the same facts SAMPLES.md carries
# as a page, committed as one JSON file so a program (an agent, an editor, a
# tool asking "which sample shows X with RAP") can answer from a single fetch
# of `main` without running anything. It is generated from the classes and the
# package index, and a committed generated file is a file that goes stale the
# first time somebody adds a sample and does not rerun the generator. This is
# what notices.
#
# catalogue-derived.json is the other half: what the LINTER knows about each
# sample - every control it BUILDS, and the minimum UI5 release that implies -
# so that a reader filtering all three sample corpora at once can ask "which
# sample shows sap.m.Table" of this one too. It needs @abap2ui5/linter, which
# is what the install below is for; the catalogue itself stays dependency-free
# and would not need one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: node scripts/generate-catalogue.mjs --check
    - run: node scripts/check-catalogue-contract.mjs
    - run: npm ci --no-audit --no-fund
    - run: node scripts/generate-derived.mjs --check
