name: create-package-branches

# One branch per package, rebuilt from main on every push.
#
# abapGit imports a whole repository - there is no sparse checkout - so without
# this a system that wants src/01 has to take the on-premise packages with it
# and gets activation errors for technology it never asked for. Each generated
# branch carries one package, the overview app and nothing else, so the abapGit
# branch dropdown becomes the place where you pick your feature.
#
# The branch list, the release each package is checked at and the shared
# directories it needs live in .github/packages.json - adding a package is one
# entry there, not a change here.
#
# Every branch is verified before it is pushed: abaplint at the release that
# package declares, which is what keeps the "Runs on" column of the README
# honest and what catches a package that has quietly grown a dependency on one
# of the other nine - and, for a package whose "Runs on" says Cloud, abaplint
# in the ABAP Cloud language version as well. On a pull request the whole thing runs except the push,
# so a change that would break a branch fails while it can still be fixed.
#
# The verifying job runs `npm ci` and the code of a pull request, so it holds
# a read-only token and a checkout without credentials. The tree it verified
# travels as an artifact to `publish`, the one job with contents: write - it
# runs nothing but git, and never for a pull request or a manual run off
# main: a dispatch from a feature branch verifies that branch and pushes
# nothing (it used to force-push the ten branches from that branch).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref, so that only runs on the SAME ref supersede each other: two
  # pushes to main share refs/heads/main and the newest wins, which is what we
  # want - a superseded run would publish older content. A pull request run
  # gets its own group. Sharing one group across refs would let a pull request
  # cancel a main run mid-publish and leave the ten branches half updated,
  # some at the new main and some at the old, without anything going red.
  group: create-package-branches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.read.outputs.branches }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: read
      run: echo "branches=$(jq -c '[.[].branch]' .github/packages.json)" >> "$GITHUB_OUTPUT"

  branch:
    needs: packages
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.packages.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ${{ matrix.branch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci

    - name: Reduce the tree to one package
      run: node scripts/build-package-branch.mjs "$BRANCH"

    # the package alone, at the release it says it needs
    - run: npx abaplint ./abaplint.jsonc

    # ...and, where its "Runs on" says Cloud, once more in the ABAP Cloud
    # language version. A release check reads statements ABAP Cloud refuses
    # (a read of sy-datum, a statement outside the Cloud language scope) as
    # fine - this is the run that found the sy-datum reads in src/03 and
    # src/04. It does NOT judge API release state: a non-Z class absent from
    # the steampunk dependency is outside errorNamespace and stays silent -
    # check-released-api.yaml is the run that does. "Cloud-capable" is decided
    # exactly as scripts/lib/read-packages.mjs decides it for catalogue.json:
    # /cloud/i on runsOn. The config is a throwaway copy; the branch keeps the
    # release config.
    - name: abaplint in ABAP Cloud language version (cloud-capable packages)
      run: |
        if jq -e --arg b "$BRANCH" \
             '.[] | select(.branch == $b) | .runsOn | test("cloud"; "i")' \
             .github/packages.json > /dev/null; then
          sed -E 's/"version": "[^"]*"/"version": "Cloud"/' abaplint.jsonc > abaplint-cloud.jsonc
          npx abaplint ./abaplint-cloud.jsonc
          rm abaplint-cloud.jsonc
        else
          echo "$BRANCH runs on Standard only - no Cloud run"
        fi

    - run: node scripts/check-overview.mjs

    # the tree exactly as verified: every file git would commit, nothing
    # ignored (node_modules, abaplint output)
    - name: Pack the verified tree
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/samples-stack'
      run: |
        git add -A
        git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/tree.tgz"
    - name: Hand the tree over
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/samples-stack'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-branch-${{ matrix.branch }}
        path: ${{ runner.temp }}/tree.tgz
        if-no-files-found: error
        retention-days: 1

  # Pushes each verified tree to its branch. Only from main - never for a
  # pull request or a dispatch from another branch - and
  # no npm here: a fresh checkout of the same commit, the tree laid over it,
  # one commit, the push. A package whose `branch` leg failed handed nothing
  # over - its branch keeps its previous state and the run stays red there.
  publish:
    needs: [packages, branch]
    if: ${{ !cancelled() && needs.packages.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/samples-stack' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.packages.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANCH: ${{ matrix.branch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: The tree the branch job verified
      id: tree
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: package-branch-${{ matrix.branch }}
        path: ${{ runner.temp }}/tree
    - name: Commit and push
      env:
        TREE: ${{ steps.tree.outcome }}
      run: |
        set -euo pipefail
        if [ "$TREE" != "success" ]; then
          echo "::warning::$BRANCH was not verified - the branch keeps its previous state"
          exit 0
        fi
        git rm -rq .
        tar -xzf "$RUNNER_TEMP/tree/tree.tgz"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff --staged --quiet || git commit -q -m "Generated from main ${GITHUB_SHA:0:7} - $BRANCH only"
        git push --force origin "HEAD:$BRANCH"
