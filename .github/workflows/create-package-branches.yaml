name: create-package-branches

# One branch per package, rebuilt from main on every push.
#
# abapGit imports a whole repository - there is no sparse checkout - so without
# this a system that wants src/01 has to take the on-premise packages with it
# and gets activation errors for technology it never asked for. Each generated
# branch carries one package, the overview app and nothing else, so the abapGit
# branch dropdown becomes the place where you pick your feature.
#
# The branch list, the release each package is checked at and the shared
# directories it needs live in .github/packages.json - adding a package is one
# entry there, not a change here.
#
# Every branch is verified before it is pushed: abaplint at the release that
# package declares, which is what keeps the "Runs on" column of the README
# honest and what catches a package that has quietly grown a dependency on one
# of the other nine - and, for a package whose "Runs on" says Cloud, abaplint
# in the ABAP Cloud language version as well. On a pull request the whole thing runs except the push,
# so a change that would break a branch fails while it can still be fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref, so that only runs on the SAME ref supersede each other: two
  # pushes to main share refs/heads/main and the newest wins, which is what we
  # want - a superseded run would publish older content. A pull request run
  # gets its own group. Sharing one group across refs would let a pull request
  # cancel a main run mid-publish and leave the ten branches half updated,
  # some at the new main and some at the old, without anything going red.
  group: create-package-branches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.read.outputs.branches }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: read
      run: echo "branches=$(jq -c '[.[].branch]' .github/packages.json)" >> "$GITHUB_OUTPUT"

  branch:
    needs: packages
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.packages.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci

    - name: Reduce the tree to one package
      run: node scripts/build-package-branch.mjs ${{ matrix.branch }}

    # the package alone, at the release it says it needs
    - run: npx abaplint ./abaplint.jsonc

    # ...and, where its "Runs on" says Cloud, once more in the ABAP Cloud
    # language version. A release check reads statements ABAP Cloud refuses
    # (a read of sy-datum, a statement outside the Cloud language scope) as
    # fine - this is the run that found the sy-datum reads in src/03 and
    # src/04. It does NOT judge API release state: a non-Z class absent from
    # the steampunk dependency is outside errorNamespace and stays silent -
    # check-released-api.yaml is the run that does. "Cloud-capable" is decided
    # exactly as scripts/lib/read-packages.mjs decides it for catalogue.json:
    # /cloud/i on runsOn. The config is a throwaway copy; the branch keeps the
    # release config.
    - name: abaplint in ABAP Cloud language version (cloud-capable packages)
      run: |
        if jq -e --arg b '${{ matrix.branch }}' \
             '.[] | select(.branch == $b) | .runsOn | test("cloud"; "i")' \
             .github/packages.json > /dev/null; then
          sed -E 's/"version": "[^"]*"/"version": "Cloud"/' abaplint.jsonc > abaplint-cloud.jsonc
          npx abaplint ./abaplint-cloud.jsonc
          rm abaplint-cloud.jsonc
        else
          echo '${{ matrix.branch }} runs on Standard only - no Cloud run'
        fi

    - run: node scripts/check-overview.mjs

    - name: Commit and push
      if: github.event_name != 'pull_request' && github.repository == 'abap2UI5/samples-stack'
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff --staged --quiet || git commit -q -m "Generated from main ${GITHUB_SHA:0:7} - ${{ matrix.branch }} only"
        git push --force origin HEAD:${{ matrix.branch }}
